name: Build Linux ARM64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/build-linux-packages.sh"
      - ".github/workflows/build-linux-arm64.yml"

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Confirm native ARM64 host
        run: |
          uname -a
          test "$(uname -m)" = "aarch64"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            rpm \
            cpio \
            dpkg-dev

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate packaging scripts
        run: |
          bash -n packaging/linux/install-tar.sh
          bash -n scripts/build-linux-packages.sh
          git diff --check

      - name: Read release version from source
        run: |
          VERSION="$(awk -F'"' '/^version = "/ {print $2; exit}' src-tauri/Cargo.toml)"
          test -n "$VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_RELEASE_VERSION=$VERSION"

      # Reuse the runtime already shipped with the official v1.6.4 ARM64
      # release. The package digest comes from its published GitHub asset
      # and the inner llama-server digest from the existing runtime manifest.
      - name: Stage certified ARM64 llama.cpp runtime
        run: |
          PACKAGE="$RUNNER_TEMP/EdgeSwarm_Node_Linux_arm64_v1.6.4.deb"
          EXPECTED_PACKAGE_SHA="e0f3633af19c1d9d9bf3a7424f0a0adb68b51ea7011768958258d19827484aad"
          EXPECTED_RUNTIME_SHA="$(node -e 'const m=require("./packaging/runtime/llama-runtime-v1.json"); process.stdout.write(m.targets["linux-arm64"].validatedRuntimeSha256 || "")')"
          test -n "$EXPECTED_RUNTIME_SHA"
          curl --fail --location --retry 3 --connect-timeout 20 \
            --output "$PACKAGE" \
            "https://github.com/Jpru20/edgeswarm-unified-node/releases/download/v1.6.4/EdgeSwarm_Node_Linux_arm64_v1.6.4.deb"
          printf '%s  %s\n' "$EXPECTED_PACKAGE_SHA" "$PACKAGE" | sha256sum -c -
          STAGING="$RUNNER_TEMP/edgeswarm-certified-arm64-runtime"
          dpkg-deb -x "$PACKAGE" "$STAGING"
          SOURCE="$STAGING/usr/lib/edgeswarm-node/runtime/current"
          test -x "$SOURCE/llama-server"
          printf '%s  %s\n' "$EXPECTED_RUNTIME_SHA" "$SOURCE/llama-server" | sha256sum -c -
          DEST="$HOME/edgeswarm-runtime-build/release/linux-arm64/current"
          mkdir -p "$DEST"
          cp -a "$SOURCE/." "$DEST/"
          echo "EDGESWARM_EXPECTED_LLAMA_SHA256=$EXPECTED_RUNTIME_SHA" >> "$GITHUB_ENV"
          echo "CERTIFIED_ARM64_LLAMA_RUNTIME=PASS"

      - name: Build ARM64 packages
        run: |
          bash scripts/build-linux-packages.sh

      - name: Validate ARM64 artifacts
        run: |
          OUT="release/linux/${RELEASE_VERSION}/arm64"
          DEB="$OUT/EdgeSwarm_Node_Linux_arm64_v${RELEASE_VERSION}.deb"
          RPM="$OUT/EdgeSwarm_Node_Linux_arm64_v${RELEASE_VERSION}.rpm"
          TAR="$OUT/EdgeSwarm_Node_Linux_arm64_v${RELEASE_VERSION}.tar.gz"

          test -f "$DEB"
          test -f "$RPM"
          test -f "$TAR"
          test -f "$OUT/SHA256SUMS.txt"

          echo "=== CHECKSUMS ==="
          (
            cd "$OUT"
            sha256sum -c SHA256SUMS.txt
          )

          echo "=== DEB ==="
          test "$(dpkg-deb -f "$DEB" Version)" = "$RELEASE_VERSION"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "arm64"
          dpkg-deb -f "$DEB" Package Version Architecture Depends

          echo "=== RPM ==="
          test "$(rpm -qp --queryformat '%{VERSION}' "$RPM")" = "$RELEASE_VERSION"
          test "$(rpm -qp --queryformat '%{ARCH}' "$RPM")" = "aarch64"
          rpm -qp --queryformat 'NAME=%{NAME}\nVERSION=%{VERSION}\nARCH=%{ARCH}\n' "$RPM"

          echo "=== PACKAGE BINARIES ==="
          TMP="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$TMP"

          file \
            "$TMP/usr/lib/edgeswarm-node/edgeswarm-node-setup" \
            "$TMP/usr/lib/edgeswarm-node/edgeswarm-node-headless"

          file "$TMP/usr/lib/edgeswarm-node/edgeswarm-node-setup" |
            grep -Ei 'ARM aarch64|aarch64'

          file "$TMP/usr/lib/edgeswarm-node/edgeswarm-node-headless" |
            grep -Ei 'ARM aarch64|aarch64'

          sha256sum \
            "$TMP/usr/lib/edgeswarm-node/edgeswarm-node-setup" \
            "$TMP/usr/lib/edgeswarm-node/edgeswarm-node-headless"

          rm -rf "$TMP"

          echo "ARM64_PACKAGE_VALIDATION=PASS"

      - name: Upload ARM64 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EdgeSwarm-Linux-ARM64-v${{ env.RELEASE_VERSION }}
          path: release/linux/${{ env.RELEASE_VERSION }}/arm64/*
          if-no-files-found: error
