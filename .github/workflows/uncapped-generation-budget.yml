name: Uncapped generation budget
on:
  pull_request:
    paths:
      - src-tauri/src/core/generation_policy.rs
      - src-tauri/src/core/production_inference.rs
      - .github/workflows/uncapped-generation-budget.yml
  push:
    branches:
      - review/generation-contract-from-v164-20261014
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libssl-dev
      - name: Test generation policy
        working-directory: src-tauri
        run: cargo test generation_policy --lib --locked
