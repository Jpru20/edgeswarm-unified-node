[package]
default-run = "edgeswarm-unified-node"
name = "edgeswarm-unified-node"
version = "1.5.16"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "edgeswarm_unified_node_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "query"] }
sha2 = "0.11.0"


ring = "0.17"
base64 = "0.22"
regex = "1"

k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

rpassword = "7"
zeroize = "1"
ctrlc = "3"
fs2 = "0.4"

[[bin]]
name = "edgeswarm-node-headless"
path = "src/bin/edgeswarm_node_headless.rs"

# EDGESWARM_DEV_BIN_GATING_V1
[features]
dev-tools = []

